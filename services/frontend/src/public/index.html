<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microservices lab</title>
<style>
  :root { --bg:#f7f6f2; --card:#fff; --text:#1f1e1d; --muted:#6b6963; --line:#e3e0d8; --accent:#534ab7; --ok:#2f7d32; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#1f1e1d; --text:#ecebe6; --muted:#9c9a92; --line:#33322f; --accent:#a9a3f0; --ok:#7fd183; --bad:#f2928b; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  h2 { font-size: 16px; font-weight: 500; margin: 0 0 12px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .pills { display:flex; flex-wrap:wrap; gap:8px; }
  .pill { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; }
  .ok { color: var(--ok); } .down { color: var(--bad); }
  table { width:100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align:left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 400; }
  form { display:grid; gap: 8px; margin-top: 12px; }
  .row { display:flex; gap: 8px; }
  input, select, button { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  input, select { flex: 1; min-width: 0; }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); }
  .msg { min-height: 20px; font-size: 13px; color: var(--muted); }
  footer { margin-top: 20px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Microservices lab</h1>
  <p class="sub">Browser &rarr; frontend &rarr; API gateway &rarr; users, orders and payments services.</p>

  <div class="card" style="margin-bottom:16px">
    <h2>Service status</h2>
    <div class="pills" id="status">loading&hellip;</div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Users</h2>
      <table><thead><tr><th>ID</th><th>Name</th><th>Email</th></tr></thead><tbody id="users"></tbody></table>
      <form id="user-form">
        <div class="row"><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email" required></div>
        <button>Add user</button>
        <div class="msg" id="user-msg"></div>
      </form>
    </div>

    <div class="card">
      <h2>Place an order</h2>
      <form id="order-form">
        <select name="userId" id="user-select" required></select>
        <div class="row"><input name="sku" placeholder="Item name" value="widget" required><input name="qty" type="number" min="1" value="2" required><input name="price" type="number" min="0" step="0.01" value="19.99" required></div>
        <button>Place order</button>
        <div class="msg" id="order-msg">Tip: totals above 5000 are declined by the payments service.</div>
      </form>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="row" style="justify-content:space-between;align-items:center"><h2>Recent orders</h2><button class="ghost" id="refresh" type="button">Refresh</button></div>
    <table><thead><tr><th>ID</th><th>User</th><th>Total</th><th>Status</th><th>Created</th></tr></thead><tbody id="orders"></tbody></table>
  </div>

  <footer id="footer"></footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const api = async (path, opts) => {
  const res = await fetch('/api' + path, opts && opts.body ? { ...opts, headers: { 'content-type': 'application/json' } } : opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

async function loadStatus() {
  try {
    const s = await api('/status');
    $('status').innerHTML = ['gateway', ...Object.keys(s.upstream)].map((k) => {
      const v = k === 'gateway' ? s.gateway : s.upstream[k];
      return `<span class="pill ${v === 'ok' ? 'ok' : 'down'}">${esc(k)}: ${esc(v)}</span>`;
    }).join('');
  } catch (e) { $('status').innerHTML = `<span class="pill down">gateway: unreachable</span>`; }
}
async function loadUsers() {
  const users = await api('/users');
  $('users').innerHTML = users.map((u) => `<tr><td>${u.id}</td><td>${esc(u.name)}</td><td>${esc(u.email)}</td></tr>`).join('');
  $('user-select').innerHTML = users.map((u) => `<option value="${u.id}">${esc(u.name)}</option>`).join('');
}
async function loadOrders() {
  const orders = await api('/orders');
  $('orders').innerHTML = orders.map((o) => `<tr><td>${o.id}</td><td>${o.userId}</td><td>${Number(o.total).toFixed(2)}</td><td class="${o.status === 'paid' ? 'ok' : 'down'}">${esc(o.status)}</td><td>${new Date(o.createdAt).toLocaleTimeString()}</td></tr>`).join('') || '<tr><td colspan="5">No orders yet.</td></tr>';
}
$('user-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  try { await api('/users', { method: 'POST', body: JSON.stringify({ name: f.get('name'), email: f.get('email') }) }); $('user-msg').textContent = 'User added.'; e.target.reset(); loadUsers(); }
  catch (err) { $('user-msg').textContent = err.message; }
});
$('order-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const body = { userId: Number(f.get('userId')), items: [{ sku: f.get('sku'), qty: Number(f.get('qty')), price: Number(f.get('price')) }] };
  try { const o = await api('/orders', { method: 'POST', body: JSON.stringify(body) }); $('order-msg').textContent = `Order ${o.id}: ${o.status} (total ${o.total})`; }
  catch (err) { $('order-msg').textContent = err.message; }
  loadOrders();
});
$('refresh').addEventListener('click', () => { loadStatus(); loadOrders(); });
fetch('/info').then((r) => r.json()).then((i) => { $('footer').textContent = `Served by frontend pod ${i.pod} (image tag ${i.image}). Refresh the page a few times with 2+ replicas to see it change.`; });
loadStatus(); loadUsers().catch(() => {}); loadOrders().catch(() => {});
</script>
</body>
</html>
